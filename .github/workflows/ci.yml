name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: futsal
          POSTGRES_USER: futsal
          POSTGRES_PASSWORD: futsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U futsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: 'True'
      SECRET_KEY: 'ci-insecure-key-for-tests-only'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      POSTGRES_DB: futsal
      POSTGRES_USER: futsal
      POSTGRES_PASSWORD: futsal
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff check
        run: ruff check apps config pytest_tests

      - name: Run ruff format check
        run: ruff format --check apps config pytest_tests

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: pytest --cov=apps --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          if-no-files-found: ignore
