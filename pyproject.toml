[project]
name = "futsal-team"
version = "0.1.0"
description = "Сайт мини-футбольной команды"
requires-python = ">=3.12"

# =============================================================================
# Ruff — линтер + форматтер
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length = 79
src = ["apps", "config"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "N",    # pep8-naming
    "RUF",  # ruff-specific
]
ignore = [
    "S101",   # assert — нужны в тестах
    "RUF001", # unicode-символы в строках (русский текст)
    "RUF002", # unicode-символы в докстрингах
    "RUF003", # unicode-символы в комментариях
    "RUF012", # mutable class attrs — несовместимо с Django Meta/migrations
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "N999"]
"config/settings.py" = ["E501"]
"pytest_tests/**/*.py" = ["S101", "S105", "S106", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.pydocstyle]
convention = "google"

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --tb=short"
testpaths = ["pytest_tests"]
markers = [
    "api: тесты API-эндпоинтов",
    "model: тесты моделей",
    "slow: медленные тесты",
]

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "*/apps.py",
    "*/admin.py",
    "manage.py",
    "config/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# =============================================================================
# Bandit
# =============================================================================

[tool.bandit]
exclude_dirs = [
    "pytest_tests",
    "apps/*/migrations",
]

[tool.bandit.assert_used]
skips = [
    "*pytest_tests/*",
    "*test_*.py",
]
