services:
  - type: web
    name: voshod
    env: python
    region: frankfurt
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "voshod.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://voshod.onrender.com"
      - key: SITE_URL
        value: "https://voshod.onrender.com"
      - key: USE_CLOUDINARY
        value: "False"
      - key: VK_ACCESS_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
