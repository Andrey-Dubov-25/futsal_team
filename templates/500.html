{% extends 'base.html' %}

{% block title %}Внутренняя ошибка — 500{% endblock %}

{% block content %}
<section class="error-page">
    <div class="error-page__code">500</div>
    <h1 class="error-page__title">Что-то пошло не так</h1>
    <p class="error-page__text">
        Мы уже знаем о проблеме и работаем над её устранением.
        Попробуйте обновить страницу через минуту.
    </p>
    <div class="error-page__actions">
        <a href="{% url 'web:home' %}" class="btn btn--primary">
            На главную
        </a>
    </div>
</section>
{% endblock %}
