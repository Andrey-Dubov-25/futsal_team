<header class="header">
    <div class="container header__inner">
        <a href="{% url 'web:home' %}" class="header__logo">
            ⚽ ФК «Футзал»
        </a>

        <nav class="header__nav">
            <a href="{% url 'web:home' %}">Главная</a>
            <a href="{% url 'web:players-list' %}">Состав</a>
            <a href="{% url 'web:staff-list' %}">Тренеры</a>
            <a href="{% url 'web:matches-list' %}">Матчи</a>
            <a href="{% url 'web:trainings-list' %}">Тренировки</a>
            <a href="{% url 'web:news-list' %}">Новости</a>
            <a href="{% url 'web:stats-team' %}">Статистика</a>
            <a href="{% url 'web:gallery-list' %}">Галерея</a>
        </nav>

        <div class="header__auth">
            {% if user.is_authenticated %}
                <a href="{% url 'web:profile' %}"
                class="btn btn--ghost">
                    {{ user.username }}
                </a>
                <form method="post"
                    action="{% url 'web:logout' %}"
                    style="display:inline;">
                    {% csrf_token %}
                    <button type="submit"
                            class="btn btn--ghost btn--small">
                        Выйти
                    </button>
                </form>
            {% else %}
                <a href="{% url 'web:login' %}" class="btn btn--ghost">
                    Войти
                </a>
                <a href="{% url 'web:register' %}"
                class="btn btn--primary btn--small">
                    Регистрация
                </a>
            {% endif %}
        </div>
    </div>
</header>
