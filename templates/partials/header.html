{% load static %}
<header class="header">
    <div class="container header__inner">
        <a href="{% url 'web:home' %}" class="header__logo">
            <img src="{% static 'img/logo.png' %}"
                 alt="МФК «Восход»"
                 class="header__logo-img">
            <span class="header__logo-text">
                <span class="header__logo-title">Восход</span>
                <span class="header__logo-subtitle">Владимир</span>
            </span>
        </a>

        <nav class="header__nav">
            <a href="{% url 'web:home' %}">Главная</a>
            <a href="{% url 'web:players-list' %}">Состав</a>
            <a href="{% url 'web:staff-list' %}">Тренеры</a>
            <a href="{% url 'web:matches-list' %}">Матчи</a>
            <a href="{% url 'web:trainings-list' %}">Тренировки</a>
            <a href="{% url 'web:news-list' %}">Новости</a>
            <a href="{% url 'web:stats-team' %}">Статистика</a>
            <a href="{% url 'web:gallery-list' %}">Галерея</a>
        </nav>

        <div class="header__auth">
            <button type="button"
                    id="theme-toggle"
                    class="theme-toggle"
                    aria-label="Переключить тему">
                🌙
            </button>

            {% if user.is_authenticated %}
                <a href="{% url 'web:profile' %}"
                   class="btn btn--ghost">
                    {{ user.username }}
                </a>
                <form method="post"
                      action="{% url 'web:logout' %}">
                    {% csrf_token %}
                    <button type="submit"
                            class="btn btn--ghost">
                        Выйти
                    </button>
                </form>
            {% else %}
                <a href="{% url 'web:login' %}"
                   class="btn btn--ghost">
                    Войти
                </a>
                <a href="{% url 'web:register' %}"
                   class="btn btn--primary">
                    Регистрация
                </a>
            {% endif %}
        </div>
    </div>
</header>
